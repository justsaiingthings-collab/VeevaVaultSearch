<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultSearch Demo</title>
  <style>
    body { margin: 0; background: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .splash { text-align: center; color: #fff; }
    .logo { width: 48px; height: 48px; background: #4A6CF7; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .logo svg { color: #fff; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    p  { font-size: 14px; color: #94A3B8; margin: 0; }
    .bar { width: 200px; height: 3px; background: #1E293B; border-radius: 2px; margin: 20px auto 0; overflow: hidden; }
    .bar-fill { height: 100%; background: #4A6CF7; border-radius: 2px; animation: load 1s ease forwards; }
    @keyframes load { from { width: 0 } to { width: 100% } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
      </svg>
    </div>
    <h1>VaultSearch Demo</h1>
    <p>Loading sample data…</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <script>
    // Clear any live session so search-panel.html enters demo mode
    sessionStorage.removeItem('vault_session_token');
    sessionStorage.removeItem('vault_base_url');
    sessionStorage.removeItem('vault_api_version');
    // Redirect after the splash animation
    setTimeout(() => { window.location.replace('search-panel.html'); }, 1000);
  </script>
</body>
</html>
